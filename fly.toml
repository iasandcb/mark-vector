# fly.toml app configuration file generated for markvector on 2026-09-08T12:42:04+09:00
#
# See https://fly.io/docs/reference/configuration/ for information about how to use this file.
#

app = 'markvector'
primary_region = 'nrt'

[build]
  dockerfile = 'Dockerfile'

[env]
  DATA_DIR = '/data'

[[mounts]]
  source = 'markvector_data'
  destination = '/data'

[http_service]
  internal_port = 8080
  force_https = true
  # Always on. This used to scale to zero (auto_stop_machines = 'stop',
  # min_machines_running = 0), which cost nothing while idle but charged a
  # few seconds of cold start to whatever hit it first after a quiet spell -
  # paid on every single visit to a share link, and again by the glasses
  # screen's reconnect loop.
  #
  # Staying up also keeps routers/live.py's channel state alive: it's an
  # in-memory dict, so a machine that stops drops every live channel and its
  # last-known content along with it, and a public page left open comes back
  # to a channel that no longer remembers anything.
  #
  # auto_start_machines stays true regardless - it costs nothing here and
  # still covers a machine that stopped for some other reason (a host
  # migration, an OOM restart).
  auto_stop_machines = 'off'
  auto_start_machines = true
  min_machines_running = 1

[[vm]]
  size = 'shared-cpu-1x'
  memory = '512mb'
