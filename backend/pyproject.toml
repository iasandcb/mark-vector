[project]
name = "mark-vector-backend"
version = "0.1.0"
description = "mark-vector FastAPI backend"
requires-python = ">=3.14"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "pydantic>=2.9",
    "python-dotenv>=1.0",
    "anthropic>=0.40",
    "openai>=1.55",
    "httpx2>=2.12",
    "asciimath2>=0.1.2",
    "pyjwt[crypto]>=2.15.1",
    "python-multipart>=0.0.32",
]

[tool.pytest.ini_options]
pythonpath = ["."]

[dependency-groups]
dev = [
    "pytest>=9.1.1",
]
