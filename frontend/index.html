<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>mark-vector</title>
  <meta name="theme-color" content="#f4f6f5">
  <meta name="description" content="A thoughtful workspace for Markdown, ideas, and AI.">
  <link rel="icon" type="image/svg+xml" href="/static/images/mark.svg">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/katex@0.18.4/dist/katex.min.css">
  <link rel="stylesheet" href="/static/css/style.css">
  <link rel="stylesheet" href="/static/css/workspace.css">
</head>
<body data-mobile-view="tree" class="app-shell">
  <div id="layout" class="layout">
    <aside id="tree-pane" class="tree-pane">
      <div class="tree-header">
        <div class="tree-header-row">
          <a href="/about" class="workspace-brand" data-i18n-title="workspace.about"><img src="/static/images/mark.svg" width="30" height="30" alt=""><h1>mark-vector<span data-i18n="workspace.tagline"></span></h1></a>
          <button id="tree-collapse-btn" class="icon-btn pane-collapse-btn" data-icon="panel-left" data-i18n-title="ui.collapsePanel"></button>
        </div>
        <button id="quick-open-btn" class="workspace-search" type="button" data-i18n-title="quickOpen.openTitle"><span data-icon="search" aria-hidden="true"></span><span data-i18n="workspace.search"></span><kbd id="search-shortcut">⌘ K</kbd></button>
        <button id="new-project-btn" class="primary-btn full-width" data-i18n="ui.newProject"></button>
      </div>
      <div class="tree-section-label"><span data-i18n="workspace.projects"></span><span id="project-count" class="section-count">0</span></div>
      <div id="hermes-section" class="hermes-section" hidden>
        <div id="hermes-header" class="hermes-header">
          <span id="hermes-disclosure" class="disclosure">▶</span>
          <span class="hermes-title" data-i18n="hermes.sectionTitle"></span>
        </div>
        <div id="hermes-list" class="hermes-list" hidden></div>
      </div>
      <div id="session-tree" class="session-tree"></div>
      <div class="tree-footer">
        <details id="workspace-settings" class="workspace-settings">
          <summary><span data-icon="settings" aria-hidden="true"></span><span data-i18n="workspace.settings"></span><span data-icon="chevron-down" aria-hidden="true"></span></summary>
          <div id="global-system-row" class="document-row global-row">
            <span class="doc-role-badge role-system">G</span>
            <span class="doc-filename" data-i18n="tree.globalSystemPrompt"></span>
          </div>
          <div id="global-custom-symbols-row" class="document-row global-row">
            <span class="doc-role-badge role-system">C</span>
            <span class="doc-filename" data-i18n="tree.globalCustomSymbols"></span>
          </div>
          <div id="global-spoken-math-row" class="document-row global-row">
            <span class="doc-role-badge role-system">S</span>
            <span class="doc-filename" data-i18n="tree.globalSpokenMath"></span>
          </div>
        </details>
        <div class="workspace-footer-row"><span id="lang-select-slot"></span><button id="shortcuts-btn" class="icon-btn" type="button" data-icon="keyboard" data-i18n-title="shortcuts.openTitle"></button></div>
        <div id="auth-info" class="auth-info" hidden></div>
      </div>
    </aside>

    <div id="tree-resizer" class="pane-resizer" data-i18n-title="ui.dragToResize"></div>

    <main id="editor-pane" class="editor-pane">
      <!-- Voice discussion: spoken turns on the left, this document on the
           right. Hidden until 🗣. On a phone the two tabs below pick one. -->
      <aside id="discuss-pane" class="discuss-pane" hidden>
        <div class="discuss-tabs" role="tablist">
          <button id="discuss-tab-talk" class="discuss-tab" type="button" role="tab" aria-selected="true" data-i18n="discuss.talk"></button>
          <button id="discuss-tab-doc" class="discuss-tab" type="button" role="tab" aria-selected="false" data-i18n="discuss.doc"></button>
        </div>
        <div class="discuss-bar">
          <button id="discuss-start" class="primary-btn" type="button" data-i18n="discuss.start"></button>
          <button id="discuss-stop" class="secondary-btn" type="button" hidden data-i18n="discuss.stop"></button>
          <button id="discuss-mute" class="secondary-btn" type="button" aria-pressed="false" data-i18n="discuss.mute"></button>
          <button id="discuss-ptt" class="secondary-btn" type="button" aria-pressed="false" data-i18n="discuss.ptt" data-i18n-title="discuss.pttTitle"></button>
          <button id="discuss-send" class="secondary-btn" type="button" data-i18n="discuss.send"></button>
          <button id="discuss-undo" class="secondary-btn" type="button" disabled data-i18n="discuss.undo"></button>
        </div>
        <div class="discuss-meta">
          <label class="discuss-silence-label">
            <span data-i18n="discuss.silenceLabel"></span>
            <input id="discuss-silence" class="discuss-silence" type="number" min="0.4" max="8" step="0.1" value="1.5" inputmode="decimal">
          </label>
          <span id="discuss-meter" class="discuss-meter"></span>
          <span id="discuss-markers" class="discuss-markers"></span>
        </div>
        <p id="discuss-status" class="discuss-status" role="status"></p>
        <div id="discuss-log" class="discuss-log" aria-live="polite">
          <p id="discuss-empty" class="discuss-empty" data-i18n="discuss.empty"></p>
        </div>
        <p id="discuss-partial" class="discuss-partial" hidden></p>
      </aside>
      <div id="editor-column" class="editor-column">
      <!-- Open documents as tabs (see the tabs section in app.js) - shown
           once there's more than one. -->
      <div id="tab-strip" class="tab-strip" role="tablist" hidden></div>
      <!-- One row: the filename (a single open document; tabs name it once
           there are two) and the tool-status pill on the left, icon tools
           in the scroller, then save / publish / X article / 대화 pinned
           with ⚙ so a narrow column scrolls tools instead of covering the
           actions or widening the page. On a narrow phone the dictation
           cluster (mic, language, engine, record) leaves that scroller for
           its own row — see workspace.css — so it is not clipped down to
           the record dot. -->
      <div class="editor-commandbar">
        <div class="pane-title-group commandbar-title">
          <span class="commandbar-label" data-i18n="workspace.editor"></span>
          <span id="editor-filename" class="pane-filename" data-i18n="editor.selectDocument"></span>
          <span id="tool-status" class="tool-status" hidden></span>
          <button id="recording-retry-btn" class="tool-status-retry" type="button" hidden data-i18n="editor.recordingRetry"></button>
          <button id="recording-download-btn" class="tool-status-retry" type="button" hidden data-i18n="editor.recordingDownload"></button>
        </div>
        <div class="editor-actions">
          <div class="editor-actions-scroll">
          <!-- Icon and wording are separate spans. The row is icon-only
               (see .btn-label in style.css); titles/aria-labels keep the
               words. The publish button's own wording is swapped in JS,
               which is why only its label span is scripted - see
               updatePublishButton. -->
          <button id="inline-complete-btn" class="secondary-btn" disabled hidden data-i18n-title="editor.inlineCompleteTitle">
            <span class="btn-icon" aria-hidden="true"><span data-icon="sparkles"></span></span>
            <span class="btn-label" data-i18n="editor.inlineComplete"></span>
          </button>
          <!-- Live dictation into the editor at the caret (see the dictation
               section in app.js) - hidden entirely in a browser without the
               Web Speech API (Firefox). The language select is its own
               per-browser preference, independent of the UI language, so a
               Korean UI can still take English dictation. -->
          <span id="dictation-group" class="dictation-group" hidden>
            <button id="dictation-btn" class="secondary-btn" type="button" disabled aria-pressed="false" data-i18n-title="editor.dictationTitle">
              <span class="btn-icon" aria-hidden="true"><span data-icon="mic"></span></span>
              <span id="dictation-label" class="btn-label" data-i18n="editor.dictation"></span>
            </button>
            <select id="dictation-lang" class="dictation-lang" data-i18n-title="editor.dictationLangTitle">
              <option value="ko-KR">KO</option>
              <option value="en-US">EN</option>
              <option value="ja-JP">JA</option>
            </select>
            <!-- Shown when more than one engine is available. The closed
                 select shows the engine actually in use (a built-in choice
                 without Web Speech shows Soniox). "realtime" in
                 localStorage is the old name for OpenAI. -->
            <select id="dictation-engine" class="dictation-lang" hidden data-i18n-title="editor.dictationEngineTitle">
              <option value="builtin" data-i18n-title="editor.dictationEngineBuiltin">🌐</option>
              <option value="openai" data-i18n-title="editor.dictationEngineRealtime">⚡</option>
              <option value="soniox" data-i18n-title="editor.dictationEngineSoniox">✦</option>
            </select>
            <!-- Record the dictation too - see recording.js. -->
            <button id="dictation-record-btn" class="dictation-lang dictation-record" type="button" hidden aria-pressed="false" data-i18n-title="editor.dictationRecordTitle"><span class="rec-dot"></span></button>
          </span>
          <!-- Gamepad remote settings (see remote.js) - shown only while a
               controller is connected; the controller itself drives the
               presenter actions (see the presenter section in app.js). -->
          <button id="remote-btn" class="secondary-btn" type="button" hidden>
            <span class="btn-icon" aria-hidden="true"><span data-icon="gamepad"></span></span>
          </button>
          <!-- Appears only with the caret inside an inline thread (see
               updateInlineThreadButton) - a control for something that isn't
               there would just be another disabled button in a row that's
               already tight on a phone. -->
          <button id="thread-toggle-btn" class="secondary-btn" type="button" disabled hidden data-i18n-title="editor.threadToggle">
            <span class="btn-icon" aria-hidden="true"><span data-icon="eye"></span></span>
            <span class="btn-label" data-i18n="editor.thread"></span>
          </button>
          <!-- Shown while split view has a document open: on, messages sent
               from here carry that document and may write to it - see the
               "document editing" section in app.js. -->
          <button id="edit-target-btn" class="secondary-btn" type="button" hidden aria-pressed="false">
            <span class="btn-icon" aria-hidden="true"><span data-icon="edit"></span></span>
          </button>
          <!-- Swaps the editor pane itself between the raw Markdown source
               (editable) and the same rendering the preview pane shows (read-
               only) - see toggleEditorViewMode in app.js. Its own "pressed"
               look means "currently rendered", same convention as
               #split-toggle-btn above. -->
          <button id="fold-all-a" class="secondary-btn" type="button" data-i18n-title="editor.foldAll">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m6 4 6 5 6-5 M6 20l6-5 6 5"/></svg>
          </button>
          <button id="unfold-all-a" class="secondary-btn" type="button" data-i18n-title="editor.unfoldAll">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m6 9 6-5 6 5 M6 15l6 5 6-5"/></svg>
          </button>
          <button id="view-mode-btn" class="secondary-btn" type="button" disabled aria-pressed="false" data-i18n-title="editor.viewModeTitle">
            <span class="btn-icon" aria-hidden="true"><span data-icon="book"></span></span>
            <span id="view-mode-label" class="btn-label" data-i18n="editor.viewModeSource"></span>
          </button>
          <!-- Opens a second, lighter editor pane (view/edit/save only - no
               AI toolbar) beside this one - see setSplitView in app.js. Its
               own "pressed" look (aria-pressed, styled in style.css) is the
               only indicator that it's open on a screen too narrow to show
               the second pane at all (a phone, or a tablet - hidden there
               entirely, see the max-width: 900px block in style.css). -->
          <button id="discuss-toggle-btn" class="secondary-btn" type="button" aria-pressed="false" data-i18n-title="discuss.toggleTitle">
            <span class="btn-icon" aria-hidden="true"><span data-icon="audio"></span></span>
            <span class="btn-label" data-i18n="discuss.toggle"></span>
          </button>
          <button id="split-toggle-btn" class="secondary-btn" type="button" aria-pressed="false" data-i18n-title="editor.splitView">
            <span class="btn-icon" aria-hidden="true"><span data-icon="columns"></span></span>
            <span class="btn-label" data-i18n="editor.splitView"></span>
          </button>
          </div>
          <!-- Pinned outside the scroller, same as ⚙: a narrow column must
               not scroll these off or grow the page. Save, publish, and
               X article are icon-only; 대화 keeps its short label and the
               accent fill. -->
          <div class="editor-primary-actions">
            <button id="save-btn" class="secondary-btn" disabled data-i18n-title="editor.save">
              <span class="btn-icon" aria-hidden="true"><span data-icon="save"></span></span>
              <span class="btn-label" data-i18n="editor.save"></span>
            </button>
            <button id="publish-btn" class="secondary-btn" disabled hidden>
              <span id="publish-icon" class="btn-icon" aria-hidden="true"><span data-icon="share"></span></span>
              <span id="publish-label" class="btn-label"></span>
            </button>
            <button id="export-x-article-btn" class="secondary-btn" disabled hidden data-i18n-title="xArticle.title" data-i18n-aria-label="xArticle.title">
              <span class="btn-icon" aria-hidden="true">𝕏</span>
              <span class="btn-label" data-i18n="xArticle.shortTitle"></span>
            </button>
          </div>
          <button id="send-btn" class="primary-btn editor-send" disabled data-i18n-title="editor.send">
            <span class="btn-icon" aria-hidden="true"><span data-icon="arrow-up"></span></span>
            <span class="btn-label" data-i18n="editor.send"></span>
          </button>
          <!-- Opens the toolbar row below, collapsed by default at every
               width (see .editor-toolbar in style.css) so this bar stays
               one line. Stays outside the scroller. -->
          <button id="toolbar-toggle-btn" class="secondary-btn toolbar-toggle" type="button" aria-expanded="false" data-i18n-title="editor.toggleToolbar">
            <span class="btn-icon" aria-hidden="true"><span data-icon="settings"></span></span>
          </button>
        </div>
      </div>
      <!-- The open document was saved in another browser while this one has
           unsaved edits of its own - see the "edits from elsewhere" section
           in app.js. A strip of its own (not in the header, which a narrow
           pane already fills with buttons), and never applied without asking. -->
      <div id="sync-conflict" class="sync-conflict" hidden>
        <span data-i18n="sync.conflict"></span>
        <button id="sync-load-btn" class="secondary-btn" type="button" data-i18n="sync.load"></button>
        <button id="sync-keep-btn" class="secondary-btn" type="button" data-i18n="sync.keep"></button>
      </div>
      <!-- One row for every per-document control. The math format applies to
           any document mark-vector owns (system prompts included), while the
           provider/model/reasoning/context ones only mean anything for a
           document that can actually be sent - so they're shown and hidden
           independently inside this shared row (see updateEditorToolbarVisibility
           in app.js), which is also why the row itself isn't just tied to one
           of those conditions. -->
      <div id="editor-toolbar" class="editor-toolbar" hidden>
        <select id="format-select" data-i18n-title="editor.formatTitle">
          <option value="latex" data-i18n="editor.formatLatex"></option>
          <option value="asciimath" data-i18n="editor.formatAsciimath"></option>
          <option value="hybrid" data-i18n="editor.formatHybrid"></option>
        </select>
        <select id="provider-select" data-i18n-aria-label="workspace.provider"></select>
        <select id="model-select" data-i18n-aria-label="workspace.model"></select>
        <!-- Only "off" is static (so the selector is never empty before the
             provider list loads) - the levels themselves are rebuilt per
             model from /api/providers' reasoning_efforts, since they differ
             per model. See updateReasoningAvailability in app.js. -->
        <select id="reasoning-select" data-i18n-title="editor.reasoningTitle">
          <option value="off" data-i18n="editor.reasoningDefault"></option>
        </select>
        <button id="set-default-model-btn" class="secondary-btn set-default-model" type="button">☆</button>
        <select id="context-scope-select" data-i18n-title="editor.contextScopeTitle">
          <option value="default" data-i18n="editor.contextScopeDefault"></option>
          <option value="sibling" data-i18n="editor.contextScopeSibling"></option>
          <option value="descendants" data-i18n="editor.contextScopeDescendants"></option>
        </select>
        <!-- Dictation's microphone - here rather than beside the 🎤, which
             has no room for it on a phone. See "microphone choice" in app.js. -->
        <button id="dictation-mic-btn" class="secondary-btn dictation-mic" type="button" hidden></button>
        <label id="live-public-row" class="checkbox-row live-public-row" hidden data-i18n-title="editor.liveTitle">
          <input type="checkbox" id="live-public-checkbox">
          <span id="live-public-status-dot" class="live-status-dot"></span>
          <span data-i18n="editor.live"></span>
        </label>
        <!-- Publish option, stored with the share link itself (see
             storage.set_publish_slides) - unlike "Live" above, which is a
             per-browser preference. Same visibility rule: published only. -->
        <label id="publish-slides-row" class="checkbox-row live-public-row" hidden data-i18n-title="editor.slidesTitle">
          <input type="checkbox" id="publish-slides-checkbox">
          <span data-i18n="editor.slides"></span>
        </label>
        <p id="provider-warning" class="warning" hidden data-i18n="provider.notConfigured"></p>
      </div>
      <!-- An audio file being transcribed as it plays - see "audio file" in app.js. -->
      <div id="audio-file-bar" class="audio-file-bar" hidden>
        <button id="audio-file-back-btn" class="secondary-btn audio-file-skip" type="button" data-i18n-title="audio.back10">↺10</button>
        <button id="audio-file-play-btn" class="secondary-btn audio-file-play" type="button">▶</button>
        <span id="audio-file-engine" class="audio-file-engine"></span>
        <button id="audio-file-forward-btn" class="secondary-btn audio-file-skip" type="button" data-i18n-title="audio.forward10">10↻</button>
        <span id="audio-file-name" class="audio-file-name"></span>
        <input id="audio-file-seek" class="audio-file-seek" type="range" min="0" max="0" step="1" value="0" data-i18n-title="editor.audioFileSeek">
        <span id="audio-file-time" class="audio-file-time" data-i18n-title="audio.clock"></span>
        <form id="audio-file-goto-form" class="audio-goto">
          <input id="audio-file-goto" type="text" inputmode="text" enterkeyhint="go" autocomplete="off" autocorrect="off" autocapitalize="off" spellcheck="false" placeholder="1:23" data-i18n-placeholder="audio.gotoPlaceholder" data-i18n-title="audio.gotoTitle" aria-describedby="audio-file-goto-error">
          <button id="audio-file-goto-btn" class="secondary-btn" type="submit" data-i18n="audio.goto" data-i18n-title="audio.gotoTitle">Go</button>
        </form>
        <p id="audio-file-goto-error" class="audio-goto-error" role="alert" hidden></p>
        <button id="audio-file-rate-btn" class="secondary-btn audio-file-rate" type="button" data-i18n-title="editor.audioFileRate">1×</button>
        <button id="audio-file-close-btn" class="icon-btn audio-file-close" type="button" data-i18n-title="editor.audioFileClose">✕</button>
      </div>
      <section id="workspace-welcome" class="workspace-welcome" aria-labelledby="welcome-title">
        <div class="welcome-content">
          <div class="welcome-art" aria-hidden="true"><div class="welcome-sheet back"></div><div class="welcome-sheet front"><span data-icon="document"></span><i></i><i></i><i></i><span class="welcome-spark" data-icon="sparkles"></span></div></div>
          <span class="welcome-eyebrow" data-i18n="workspace.welcomeEyebrow"></span>
          <h2 id="welcome-title" data-i18n="workspace.welcomeTitle"></h2>
          <p data-i18n="workspace.welcomeDescription"></p>
          <button id="welcome-create-btn" class="primary-btn welcome-create" type="button"><span data-icon="plus" aria-hidden="true"></span><span data-i18n="workspace.startProject"></span><span data-icon="arrow-right" aria-hidden="true"></span></button>
          <button id="welcome-open-btn" class="welcome-open" type="button"><span data-i18n="workspace.openDocument"></span><kbd>⌘ K</kbd></button>
          <div class="welcome-note"><span data-icon="markdown" aria-hidden="true"></span><span data-i18n="workspace.welcomeNote"></span></div>
        </div>
      </section>
      <textarea id="editor" class="editor" data-i18n-placeholder="editor.placeholder" disabled></textarea>
      <!-- The "rendered" half of #view-mode-btn's toggle: an absolutely-
           positioned cover over the editor (.editor-pane already establishes
           the positioning context) rather than swapping CodeMirror's own DOM
           out, so editor.js/CodeMirror stay untouched by this - see
           renderEditorView in app.js. Shares .markdown-body with the real
           preview pane, so it picks up the exact same typography/math/thread
           styling for free. -->
      <div id="editor-rendered" class="markdown-body editor-rendered" hidden></div>
      <footer id="document-status" class="document-status" hidden><span id="document-save-state"></span><span id="document-character-count"></span><span class="document-format">Markdown <span>·</span> UTF-8</span></footer>
      <div class="scroll-nav">
        <button id="editor-scroll-top-btn" class="icon-btn scroll-nav-btn" type="button" data-i18n-title="ui.scrollToTop" data-icon="arrow-up"></button>
        <button id="editor-scroll-bottom-btn" class="icon-btn scroll-nav-btn" type="button" data-i18n-title="ui.scrollToBottom" data-icon="arrow-down"></button>
      </div>
      </div>
    </main>

    <div id="split-resizer" class="pane-resizer" data-i18n-title="ui.dragToResize" hidden></div>

    <!-- The split-view companion to .editor-pane above: view/edit/save any
         document beside the primary one, but none of its AI toolbar (no
         send, no inline-complete, no provider/model row) - see setSplitView
         and selectDocumentB in app.js. When the left document is the
         matching `.c.md` and this pane shows its `.md`, Publish and X
         Article appear here and act on this pane's document. Starts hidden;
         opened from #split-toggle-btn or by opening a document "to the
         side" from the tree (⌘/Ctrl-click a row, or its own tree icon). -->
    <main id="editor-pane-b" class="editor-pane" hidden>
      <div class="pane-header">
        <div class="pane-title-group">
          <span id="editor-filename-b" class="pane-filename" data-i18n="editor.selectDocument"></span>
        </div>
        <div class="editor-actions">
          <div class="editor-actions-scroll">
          <button id="fold-all-b" class="secondary-btn" type="button" data-i18n-title="editor.foldAll">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m6 4 6 5 6-5 M6 20l6-5 6 5"/></svg>
          </button>
          <button id="unfold-all-b" class="secondary-btn" type="button" data-i18n-title="editor.unfoldAll">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m6 9 6-5 6 5 M6 15l6 5 6-5"/></svg>
          </button>
          </div>
          <div class="editor-primary-actions">
            <button id="publish-btn-b" class="secondary-btn" type="button" disabled hidden>
              <span id="publish-icon-b" class="btn-icon" aria-hidden="true"><span data-icon="share"></span></span>
              <span id="publish-label-b" class="btn-label"></span>
            </button>
            <button id="export-x-article-btn-b" class="secondary-btn" type="button" disabled hidden data-i18n-title="xArticle.title" data-i18n-aria-label="xArticle.title">
              <span class="btn-icon" aria-hidden="true">𝕏</span>
              <span class="btn-label" data-i18n="xArticle.shortTitle"></span>
            </button>
            <button id="save-btn-b" class="secondary-btn" disabled data-i18n-title="editor.save">
              <span class="btn-icon" aria-hidden="true"><span data-icon="save"></span></span>
            </button>
          </div>
          <button id="close-split-btn" class="icon-btn" type="button" data-i18n-title="ui.closeSplit" data-icon="close"></button>
        </div>
      </div>
      <!-- What the conversation in the other pane just changed here, with a
           way back - see the "document editing" section in app.js. -->
      <div id="doc-edit-strip" class="sync-conflict" hidden>
        <span id="doc-edit-summary"></span>
        <button id="doc-edit-undo-btn" class="secondary-btn" type="button" data-i18n="docEdit.undo"></button>
        <button id="doc-edit-dismiss-btn" class="icon-btn" type="button" data-i18n-title="docEdit.dismiss">×</button>
      </div>
      <textarea id="editor-b" class="editor" data-i18n-placeholder="editor.placeholder" disabled></textarea>
      <div class="scroll-nav">
        <button id="editor-scroll-top-btn-b" class="icon-btn scroll-nav-btn" type="button" data-i18n-title="ui.scrollToTop" data-icon="arrow-up"></button>
        <button id="editor-scroll-bottom-btn-b" class="icon-btn scroll-nav-btn" type="button" data-i18n-title="ui.scrollToBottom" data-icon="arrow-down"></button>
      </div>
    </main>

    <div id="preview-resizer" class="pane-resizer" data-i18n-title="ui.dragToResize"></div>

    <section id="preview-pane" class="preview-pane">
      <div class="pane-header">
        <!-- Preview, or one of two LLM readings of the same document - see
             analysis.js. The actions after it belong to Preview only. -->
        <div id="preview-tabs" class="preview-tabs" role="tablist">
          <button type="button" class="preview-tab active" role="tab" aria-selected="true" data-view="preview" data-i18n="preview.title"></button>
          <button type="button" class="preview-tab" role="tab" aria-selected="false" data-view="evaluate" data-i18n="analysis.evaluate" data-i18n-title="analysis.evaluateTitle"></button>
          <button type="button" class="preview-tab" role="tab" aria-selected="false" data-view="formalize" data-i18n="analysis.formalize" data-i18n-title="analysis.formalizeTitle"></button>
        </div>
        <div class="preview-actions">
          <!-- Which editor this preview follows while split view is open.
               Hidden otherwise. Auto is the focused pane, except a .c.md
               file beside its .md file stays on the right document. -->
          <div id="preview-pin" class="preview-pin" hidden role="radiogroup" data-i18n-aria-label="preview.pinTitle">
            <button type="button" class="preview-pin-btn active" data-pin="auto" aria-pressed="true" data-i18n="preview.pinAuto" data-i18n-title="preview.pinAutoTitle">Auto</button>
            <button type="button" class="preview-pin-btn" data-pin="left" aria-pressed="false" data-i18n="preview.pinLeft" data-i18n-title="preview.pinLeftTitle">Left</button>
            <button type="button" class="preview-pin-btn" data-pin="right" aria-pressed="false" data-i18n="preview.pinRight" data-i18n-title="preview.pinRightTitle">Right</button>
          </div>
          <label class="checkbox-row sync-scroll-row preview-only">
            <input type="checkbox" id="sync-scroll-checkbox">
            <span data-i18n="preview.syncScroll"></span>
          </label>
          <label class="checkbox-row glasses-row preview-only">
            <input type="checkbox" id="glasses-checkbox">
            <span data-i18n="preview.glasses"></span>
          </label>
          <button id="download-md-btn" class="icon-btn preview-only" disabled data-i18n-title="preview.downloadMdTitle">⤓ MD</button>
          <button id="export-pdf-btn" class="icon-btn preview-only" disabled data-i18n-title="preview.exportPdfTitle">⤓ PDF</button>
          <button id="copy-md-btn" class="icon-btn preview-only" type="button" disabled data-i18n="preview.copyMd" data-i18n-title="preview.copyMdTitle" aria-live="polite">Copy to clipboard</button>
          <button id="preview-collapse-btn" class="icon-btn pane-collapse-btn" data-i18n-title="ui.collapsePanel" data-icon="panel-right"></button>
        </div>
      </div>
      <div id="glasses-toolbar" class="glasses-toolbar" hidden>
        <span id="glasses-status-dot" class="live-status-dot"></span>
        <span class="glasses-toolbar-label" data-i18n="preview.glassesUrlLabel"></span>
        <input id="glasses-url-input" class="glasses-url-input" type="text" readonly data-i18n-title="preview.glassesUrlTitle">
        <button id="glasses-copy-btn" class="icon-btn" type="button" data-i18n-title="preview.glassesCopyTitle" data-icon="copy"></button>
      </div>
      <div id="preview-empty" class="preview-empty"><span class="preview-empty-icon" data-icon="document" aria-hidden="true"></span><h2 data-i18n="workspace.previewTitle"></h2><p data-i18n="workspace.previewDescription"></p><span class="preview-empty-caption" data-i18n="workspace.previewCaption"></span></div>
      <div id="preview" class="preview markdown-body"></div>
      <div id="analysis-view" class="analysis-view" hidden>
        <div class="analysis-toolbar">
          <select id="analysis-lens-select" class="analysis-lens" hidden data-i18n-title="analysis.lensTitle">
            <option value="math" data-i18n="analysis.lens.math"></option>
            <option value="logic" data-i18n="analysis.lens.logic"></option>
            <option value="writing" data-i18n="analysis.lens.writing"></option>
            <option value="live" data-i18n="analysis.lens.live"></option>
          </select>
          <button id="analysis-run-btn" class="primary-btn" type="button"></button>
          <button id="analysis-now-btn" class="secondary-btn" type="button" hidden data-i18n="analysis.live.now" data-i18n-title="analysis.live.nowTitle"></button>
          <span id="analysis-status" class="analysis-status"></span>
          <button id="analysis-clear-btn" class="secondary-btn" type="button" hidden data-i18n="analysis.live.clear"></button>
          <button id="analysis-copy-btn" class="icon-btn" type="button" hidden data-i18n-title="analysis.copy">⧉</button>
          <a id="analysis-lean-link" class="secondary-btn analysis-lean-link" target="_blank" rel="noopener" hidden data-i18n="analysis.openLean"></a>
        </div>
        <div id="analysis-body" class="analysis-body markdown-body"></div>
      </div>
      <div class="scroll-nav">
        <button id="preview-scroll-top-btn" class="icon-btn scroll-nav-btn" type="button" data-i18n-title="ui.scrollToTop" data-icon="arrow-up"></button>
        <button id="preview-scroll-bottom-btn" class="icon-btn scroll-nav-btn" type="button" data-i18n-title="ui.scrollToBottom" data-icon="arrow-down"></button>
      </div>
    </section>
  </div>

  <button id="tree-expand-btn" class="pane-expand-btn" hidden data-i18n-title="ui.expandPanel" data-icon="panel-left"></button>
  <button id="preview-expand-btn" class="pane-expand-btn" hidden data-i18n-title="ui.expandPanel" data-icon="panel-right"></button>

  <!-- Populated with a snapshot of #preview's rendered HTML right before
       window.print() (see exportPreviewToPdf in app.js) - kept separate
       from the live preview pane so PDF export works regardless of the
       pane's current width/collapsed state, and so the print stylesheet
       (style.css's @media print block) only has to isolate one fixed
       target instead of fighting the resizable 3-pane grid layout. -->
  <div id="print-target" class="markdown-body"></div>

  <nav id="mobile-tabs" class="mobile-tabs">
    <button type="button" class="mobile-tab active" data-view="tree"><span data-icon="folder" aria-hidden="true"></span><span data-i18n="mobile.tree"></span></button>
    <button type="button" class="mobile-tab" data-view="editor"><span data-icon="edit" aria-hidden="true"></span><span data-i18n="mobile.editor"></span></button>
    <button type="button" class="mobile-tab" data-view="preview"><span data-icon="eye" aria-hidden="true"></span><span data-i18n="mobile.preview"></span></button>
  </nav>

  <!-- Fuzzy jump-to-document across every project/folder, not just the open
       session's own siblings (that's what the ⌃/⌥ digit hints further up
       already cover) - see openQuickOpen in app.js. Hidden by default;
       opened with ⌘/Ctrl+P or ⌘/Ctrl+K, or the 🔍 button above the tree. -->
  <div id="quick-open-overlay" class="quick-open-overlay" hidden>
    <div class="quick-open-panel" role="dialog" aria-modal="true" data-i18n-aria-label="quickOpen.openTitle">
      <input
        id="quick-open-input"
        data-i18n-aria-label="quickOpen.openTitle"
        class="quick-open-input"
        type="text"
        data-i18n-placeholder="quickOpen.placeholder"
        autocomplete="off"
        autocapitalize="off"
        spellcheck="false"
      >
      <div id="quick-open-results" class="quick-open-results"></div>
      <div id="quick-open-empty" class="quick-open-empty" data-i18n="quickOpen.empty" hidden></div>
      <div id="quick-open-hint" class="quick-open-hint" data-i18n="quickOpen.hint"></div>
    </div>
  </div>

  <!-- Every keyboard shortcut this app binds, in one place - see
       renderShortcutsHelp in app.js, which is also the one source of truth
       these rows are generated from (nothing here is hand-duplicated, so a
       shortcut added there can't quietly go undocumented here). Opened with
       "?" (outside any text field - see the shortcuts-help keydown listener)
       or the ⌨ button above the tree. -->
  <div id="shortcuts-overlay" class="quick-open-overlay" hidden>
    <div class="quick-open-panel shortcuts-panel" role="dialog" aria-modal="true" data-i18n-aria-label="shortcuts.title">
      <div class="shortcuts-header">
        <span data-i18n="shortcuts.title"></span>
        <button id="shortcuts-close-btn" class="icon-btn" type="button" data-i18n-title="ui.close" data-icon="close"></button>
      </div>
      <div id="shortcuts-groups" class="shortcuts-groups"></div>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/katex@0.18.4/dist/katex.min.js"
    integrity="sha384-ykMNcWQhhTUb0YV9SPpPUFURHZ+tWmubkakGBP+OgNK/UXdO2gtzglWx0Rj9hnO3"
    crossorigin="anonymous"></script>
  <!-- A newer build is on the server than the one this tab loaded - see the
       "new version deployed" section in app.js. -->
  <div id="update-banner" class="update-banner" role="status" hidden>
    <span data-i18n="update.available"></span>
    <button id="update-reload-btn" class="primary-btn" type="button" data-i18n="update.reload"></button>
  </div>

  <script type="module" src="/static/js/app.js"></script>
</body>
</html>
